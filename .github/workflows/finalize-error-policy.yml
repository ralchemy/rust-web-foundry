name: Finalize generated error policy

on:
  push:
    branches:
      - refactor/code-first-rust-review

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/code-first-rust-review
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install cargo-generate
        run: cargo install cargo-generate --version 0.23.14 --locked
      - name: Format, refresh lock, and remove temporary workflows
        run: |
          set -euo pipefail
          branch=refactor/code-first-rust-review

          for attempt in 1 2 3; do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"

            template="$RUNNER_TEMP/final-template"
            generated="$RUNNER_TEMP/final-generated"
            rm -rf "$template" "$generated"
            mkdir -p "$template" "$generated"
            git archive HEAD | tar -x -C "$template"
            rm -f \
              "$template/.github/workflows/format-template-rust.yml" \
              "$template/.github/workflows/finalize-error-policy.yml"
            cat > "$template/cargo-generate.toml" <<'EOF'
          [template]
          exclude = [
            ".git",
            ".github/workflows/template.yml",
            "cargo-generate.toml",
            "TEMPLATE.md",
            ".scratch",
            "postmortem",
          ]
          EOF

            cargo generate \
              --path "$template" \
              --name final-error-policy \
              --destination "$generated" \
              --vcs none
            project="$generated/final-error-policy"
            cd "$project"
            cargo fmt --all
            cargo generate-lockfile

            cd "$GITHUB_WORKSPACE"
            while IFS= read -r -d '' source; do
              path=${source#"$project/"}
              mkdir -p "$(dirname "$path")"
              cp "$source" "$path"
            done < <(find "$project/app" "$project/crates" -type f -name '*.rs' -print0)
            sed 's/final-error-policy/{{ project-name }}/g' \
              "$project/Cargo.lock" > Cargo.lock.liquid
            rm -f \
              .github/workflows/format-template-rust.yml \
              .github/workflows/finalize-error-policy.yml
            cat > cargo-generate.toml <<'EOF'
          [template]
          exclude = [
            ".git",
            ".github/workflows/template.yml",
            "cargo-generate.toml",
            "TEMPLATE.md",
            ".scratch",
            "postmortem",
          ]
          EOF

            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "chore: finalize thiserror anyhow template"
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            cd "$GITHUB_WORKSPACE"
            sleep 30
          done

          echo "failed to finalize branch after retries" >&2
          exit 1
