name: Template

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: app
          MYSQL_PASSWORD: app
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uapp -papp"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      DATABASE_URL: mysql://app:app@127.0.0.1:3306/app
      MIGRATION_DATABASE_URL: mysql://app:app@127.0.0.1:3306/app
      TEST_DATABASE_URL: mysql://app:app@127.0.0.1:3306/app
      DEPLOYMENT_ENVIRONMENT: ci
      LOG_FORMAT: text
      RUST_LOG: info
      TASK_POLICY_URL: http://127.0.0.1:4001/check
      TRACE_EXPORTER: console
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install template tools
        run: |
          cargo install cargo-generate --version 0.23.14 --locked
          cargo install just --version 1.58.0 --locked
          cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features rustls,mysql
      - name: Generate and verify
        run: |
          template_root=$PWD
          test -f "$template_root/AGENTS.md"
          test "$(find "$template_root" -type f -name AGENTS.md | wc -l)" -eq 1
          test "$(find "$template_root/.agents/skills" -type f -name SKILL.md | wc -l)" -eq 0
          cargo generate --path . --name template-smoke --destination "$RUNNER_TEMP" --vcs none
          cd "$RUNNER_TEMP/template-smoke"
          test -f .github/workflows/ci.yml
          test "$(find crates -name Cargo.toml | wc -l)" -eq 4
          test -f app/Cargo.toml

          rendered_governance_files=(
            AGENTS.md
            app/AGENTS.md
            crates/application/AGENTS.md
            crates/domain/AGENTS.md
            crates/http/AGENTS.md
            crates/infrastructure/AGENTS.md
            .agents/skills/add-endpoint/SKILL.md
            .agents/skills/add-migration/SKILL.md
            .agents/skills/ddd-discover/SKILL.md
            .agents/skills/ddd-model-review/SKILL.md
            .agents/skills/ddd-strategic-design/SKILL.md
            .agents/skills/ddd-tactical-design/SKILL.md
            .agents/skills/review-pr/SKILL.md
          )
          for path in "${rendered_governance_files[@]}"; do
            cmp -s "$template_root/$path.liquid" "$path"
          done

          verbatim_governance_files=(
            docs/agents/domain.md
            docs/agents/context-routes.tsv
            docs/agents/routed-context-budgets.tsv
            docs/guide/README.md
            docs/guide/app/configuration.md
            docs/guide/architecture/README.md
            docs/guide/architecture/error-handling.md
            docs/guide/architecture/ports-and-adapters.md
            docs/guide/architecture/project-structure.md
            docs/guide/development.md
            docs/guide/domain/modeling.md
            docs/guide/http/middleware.md
            docs/guide/http/routing-and-handlers.md
            docs/guide/http/state-management.md
            docs/guide/http/validation.md
            docs/guide/infrastructure/database.md
            docs/guide/observability.md
            docs/guide/reference/async-and-cancellation.md
            docs/guide/reference/authentication-and-authorization.md
            docs/guide/reference/deployment.md
            docs/guide/reference/grpc.md
            docs/guide/reference/idiomatic-rust.md
            docs/guide/reference/outbound-http.md
            docs/guide/reference/performance.md
            docs/guide/reference/typestate.md
            docs/guide/runtime.md
            docs/guide/security.md
            scripts/check-agent-context.sh
            scripts/compile-agent-context.sh
            scripts/load-review-reports.sh
          )
          for path in "${verbatim_governance_files[@]}"; do
            cmp -s "$template_root/$path" "$path"
          done

          for heading in \
            '## Compiled Context Pack' \
            '## Design checkpoint' \
            '## Coherent implementation slices' \
            '## Governance and documentation changes' \
            '## Routed-context budget' \
            '## Dependency selection'
          do
            grep -Fqx "$heading" docs/guide/development.md
          done

          grep -Fq '{{ project-name }}' "$template_root/docs/guide/testing.md"
          grep -Fq 'template-smoke' docs/guide/testing.md
          ! grep -Fq '{{ project-name }}' docs/guide/testing.md

          while IFS= read -r -d '' source; do
            path=${source#"$template_root/"}
            test -f "${path%.liquid}"
            test ! -e "$path"
          done < <(find "$template_root" -type f -name '*.liquid' -print0)
          test -z "$(find . -type f -name '*.liquid' -print -quit)"

          for path in cargo-generate.toml TEMPLATE.md .scratch postmortem .github/workflows/template.yml; do
            test ! -e "$path"
          done
          grep -Fxq '# template-smoke' README.md
          ! grep -Fq 'Primary design reference: Bulletproof Rust Web' README.md

          test "$(wc -c < AGENTS.md)" -le 4000
          bash scripts/check-agent-context.sh
          if grep -RInE --exclude-dir=.git '\{\{ *(project-name|crate_name)|\{% *(raw|endraw)' .; then
            echo "unresolved template syntax"
            exit 1
          fi
          bash scripts/check-idiomatic-rust.sh
          just ci
