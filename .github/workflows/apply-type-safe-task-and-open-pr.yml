name: Apply type-safe Task implementation and open PR

on:
  push:
    branches:
      - agent/type-safe-task-golden-path-pr
    paths:
      - .github/workflows/apply-type-safe-task-and-open-pr.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-and-open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/type-safe-task-golden-path-pr

      - name: Apply implementation patch
        shell: bash
        run: |
          set -euo pipefail
          patch=.github/patches/type-safe-task-commits.patch
          test -s "$patch"

          if head -n 1 "$patch" | grep -Eq '^From [0-9a-f]{40} '; then
            git am --3way "$patch"
          else
            git apply --3way "$patch"
          fi

      - name: Remove staging-only files and format
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patches/type-safe-task-commits.patch
          rm -f .github/workflows/apply-type-safe-task-and-open-pr.yml
          rmdir .github/patches 2>/dev/null || true
          cargo fmt --all
          git diff --check

      - name: Commit and push implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chatgpt-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "feat: add type-safe Task golden path"
          fi
          git push origin HEAD:agent/type-safe-task-golden-path-pr

      - name: Open draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh pr view --repo ralchemy/rust-web-foundry agent/type-safe-task-golden-path-pr >/dev/null 2>&1; then
            exit 0
          fi

          cat > /tmp/pr-body.md <<'EOF'
          ## Summary

          - expand the canonical Task example into create and lookup golden paths
          - demonstrate explicit HTTP, Application, Domain, MySQL-row, and downstream-wire types
          - use `FromStr`, `TryFrom`, and `From` according to failure semantics
          - map MySQL reads through private rows and checked `sqlx::query_as!`
          - add framework-neutral idiomatic Rust and SQLx rules for coding agents
          - add architecture checks and focused tests for conversion and reconstruction boundaries

          ## Architecture

          The reference flow now demonstrates:

          ```text
          HTTP DTO
            -> Application command
            -> Domain values/entity
            -> outbound wire and MySQL adapters
            -> private TaskRow
            -> Domain reconstitution
            -> Application view
            -> HTTP response
          ```

          Types are introduced for distinct contracts, representations, trust levels, lifecycles, or business meanings—not merely to mirror directory layers.

          ## Validation

          The patch is formatted and checked with `git diff --check` before this PR is opened. Repository CI remains the source of truth for full Rust, SQLx offline, MySQL, HTTP, and lifecycle validation.

          ## Review notes

          This is intentionally a Draft PR because the change expands the canonical reference slice and its governing conventions. The Matt Pocock Skills local artifacts remain ignored and are not made part of the framework-neutral repository contract.
          EOF

          gh pr create \
            --repo ralchemy/rust-web-foundry \
            --base main \
            --head agent/type-safe-task-golden-path-pr \
            --title "Add a complete type-safe Task golden path" \
            --body-file /tmp/pr-body.md \
            --draft
